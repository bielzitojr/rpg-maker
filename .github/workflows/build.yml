name: Build Windows
on:
  push:
    branches: [main]
    paths: ['godot/**', '.github/workflows/build.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: windows-release
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - name: Install Godot
        run: |
          curl -fL --retry 3 -o /tmp/godot.zip https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot*
          sudo mv /tmp/godot/Godot* /usr/local/bin/godot
          curl -fL --retry 3 -o /tmp/templates.tpz https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_export_templates.tpz
          mkdir -p ~/.local/share/godot/export_templates/4.7.2.stable
          unzip -j /tmp/templates.tpz 'templates/windows_release_x86_64.exe' 'templates/windows_debug_x86_64.exe' -d ~/.local/share/godot/export_templates/4.7.2.stable
      - name: Import and test
        run: |
          godot --headless --path godot --editor --quit
          timeout 120 godot --headless --path godot --script res://tests/specializations_tests.gd -- --test
          timeout 120 godot --headless --path godot --script res://tests/restore_tests.gd -- --test
      - name: Export Windows
        run: |
          mkdir -p exports
          godot --headless --path godot --export-release Windows ../exports/RPGMaker.exe
          cd exports
          zip -9 RPGMaker-Windows.zip RPGMaker.exe
      - uses: actions/upload-artifact@v4
        with:
          name: RPGMaker-Windows
          path: exports/RPGMaker-Windows.zip
      - name: Publish download
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "build-${GITHUB_RUN_NUMBER}" exports/RPGMaker-Windows.zip --target "$GITHUB_SHA" --title "RPG Maker · build ${GITHUB_RUN_NUMBER}" --notes "Build automático para Windows. Extraia o ZIP e execute RPGMaker.exe. Cada jogador configura sua própria chave de IA nas configurações." --latest
